gateway:
  instance:
    id: WA1
  # local: A2/E2 are declared but left blank.
  targets:
    A1: ws://127.0.0.1:6701/clientws/A1
    A2:
    E1: ws://127.0.0.1:6703/clientws/E1
    E2:
  ring:
    G1: A1,A2,E1,E2
    G2: E1,E2,A1,A2
  recover:
    enabled: true
    G1: A1,A2
    G2: E1,E2
  prefer:
    enabled: true
    G1: A1,A2
    G2: E1,E2
