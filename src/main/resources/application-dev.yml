gateway:
  instance:
    id: ${GATEWAY_INSTANCE_ID:WA1}
  # dev: U2/A2 are declared but left blank.
  targets:
    U1: ws://127.0.0.1:6701/clientws/U1
    U2:
    A1: ws://127.0.0.1:6703/clientws/A1
    A2:
  ring:
    G1: U1,U2,A1,A2
    G2: A1,A2,U1,U2
  recover:
    enabled: true
    G1: U1,U2
    G2: A1,A2
  prefer:
    enabled: true
    G1: U1,U2
    G2: A1,A2
