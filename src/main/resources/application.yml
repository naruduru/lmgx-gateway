server:
  port: 6600
  ssl:
    enabled: false

gateway:
  group:
    override: G1

  targets:
    A1: ws://${gateway.target-hosts.A1:127.0.0.1}:${gateway.target-ports.A1:6701}/clientws/A1
    A2: ws://${gateway.target-hosts.A2:127.0.0.1}:${gateway.target-ports.A2:6702}/clientws/A2
    E1: ws://${gateway.target-hosts.E1:127.0.0.1}:${gateway.target-ports.E1:6703}/clientws/E1
    E2: ws://${gateway.target-hosts.E2:127.0.0.1}:${gateway.target-ports.E2:6704}/clientws/E2

  ring:
    G1: A1,A2,E1,E2
    G2: E1,E2,A1,A2

  recover:
    G1: A1,A2
    G2: E1,E2

  prefer:
    G1: A1,A2
    G2: E1,E2

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.lmgx.gateway: debug

