server:
  port: 6600
  ssl:
    enabled: false

gateway:
  group:
    override: G1

  targets:
    U1: ws://${gateway.target-hosts.U1:127.0.0.1}:${gateway.target-ports.U1:6701}/clientws/U1
    U2: ws://${gateway.target-hosts.U2:127.0.0.1}:${gateway.target-ports.U2:6702}/clientws/U2
    A1: ws://${gateway.target-hosts.A1:127.0.0.1}:${gateway.target-ports.A1:6703}/clientws/A1
    A2: ws://${gateway.target-hosts.A2:127.0.0.1}:${gateway.target-ports.A2:6704}/clientws/A2

  ring:
    G1: U1,U2,A1,A2
    G2: A1,A2,U1,U2

  recover:
    enabled: true
    G1: U1,U2
    G2: A1,A2

  prefer:
    enabled: true
    G1: U1,U2
    G2: A1,A2
  refer:
    G1: U1,U2
    G2: A1,A2
  ws:
    # ACK timeout for WS requests (ms)
    ack-timeout-ms: 3000
    backoff:
      initial-ms: 5000
      max-ms: 1800000
      multiplier: 2.0
  uq:
    response-timeout-ms: 300000
    session-inflight-ttl-ms: 300000
    serialized-chat-commands: 1045
    session-key-fields: TenantId+ReqUserId,TenantId+reqUserId,tenantId+ReqUserId,tenantId+reqUserId,UCID,ucid,SessionId,sessionId,SESSION_ID,ChatId,chatId,CHAT_ID,RoomId,roomId,ROOM_ID,UserId,userId,USER_ID,CallingUserId,callingUserId

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.lmgx.gateway: debug

spring:
  datasource:
    # DB integration note: replace with site-specific DB settings or disable DB usage.
    url: jdbc:postgresql://localhost:5432/lmgx_gateway
